services:
  - type: web
    name: laundry-management-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run db:generate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
